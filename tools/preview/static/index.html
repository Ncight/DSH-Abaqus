<style>

  .chk.error b { color: #c00000; } .chk.warn b { color: #c87800; } .chk.info b { color: #0050a0; } .chk.ok b { color: #2e8b2e; }
  #propHead { flex: 0 0 auto; padding: 3px 6px; background: #dcdcdc; border-top: 1px solid #a0a0a0; border-bottom: 1px solid #a0a0a0; font-weight: bold;

  #vpWrap { position: relative; min-width: 0; min-height: 0; border: 3px solid #000080; display: flex; flex-direction: column; }

  .cm { border: 1px solid #d0d0d0; background: #fff; margin: 3px 0; padding: 3px 5px; display: grid; grid-template-columns: 1fr auto; gap: 2px 6px; }

  #modal textarea { width: 100%; box-sizing: border-box; height: 180px; font: 12px Consolas, monospace; }
  #vp { position: relative; flex: 1 1 auto; min-height: 0; background: linear-gradient(#1b2d46, #a3b1c6); }

  #legend { position: absolute; left: 10px; top: 10px; color: #fff; text-shadow: 0 0 2px #000; line-height: 17px; max-height: 70%; overflow: hidden; }
  #legend i { display: inline-block; width: 12px; height: 12px; margin-right: 6px; border: 1px solid #000; vertical-align: -2px; }

  #big h3 { margin: 0 0 6px; font-size: 13px; color: #a04000; }

         font-family: Consolas, "Microsoft YaHei", monospace; white-space: pre-wrap; }

  /* narrow pane (sidebar browser): the tree becomes a drawer, secondary controls fold away */

  body.narrow #left { position: absolute; z-index: 20; left: 0; top: 0; bottom: 0; width: min(88%, 340px); box-shadow: 4px 0 12px rgba(0,0,0,.4); }
  body.narrow #msg { flex-basis: 46px; }

                      box-shadow: 0 4px 10px rgba(0,0,0,.35); padding: 6px 8px; flex-direction: column; align-items: flex-start; gap: 5px; }
  body.narrow #more.open { display: flex; }
  body.narrow #more .sep { display: none; }
  body.narrow #ctx .wide { display: none; }
  body.narrow #triad { width: 72px; height: 72px; }
</style>

<body>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from '/static/OrbitControls.js';

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const enc = encodeURIComponent;
const DOF = ['', 'U1', 'U2', 'U3', 'UR1', 'UR2', 'UR3', 'WARP', 'POR', '', '', 'NT11'];
const PALETTE = ['#3cb5a0', '#e6853c', '#5b8fd6', '#d6c84a', '#b56bd0', '#6cc04a', '#d65b7a', '#47c4d6',
                 '#a08060', '#8f9bd6', '#d69a5b', '#5bd6a0'];
const DEFAULT_COLOR = '#3cb5a0', UNASSIGNED = '#8c8c8c', RIGID = '#c9ccd4', HILITE = 0xff0000;

// numbers: never scientific notation; 4 decimals, or 4 significant digits for tiny values
function fmt(v) {
  const x = typeof v === 'number' ? v : Number(v);
  if (v === '' || v === null || v === undefined || !isFinite(x)) return String(v ?? '');
  if (x === 0) return '0.0000';
  const a = Math.abs(x);
  if (a >= 1e-4) return x.toFixed(4);
  return x.toFixed(Math.min(20, 3 - Math.floor(Math.log10(a))));
}
const fmtTok = t => (t !== '' && /^[-+]?(\d+\.?\d*|\.\d+)([eEdD][-+]?\d+)?$/.test(t) && /[.eEdD]/.test(t)) ? fmt(Number(t.replace(/[dD]/, 'e'))) : t;
const rowTxt = r => r.filter((t, i) => t !== '' || i < r.length - 1).map(fmtTok).join(', ');
const paramTxt = p => Object.entries(p || {}).map(([k, v]) => v === true ? k.toLowerCase() : k.toLowerCase() + '=' + v).join(', ');

function log(s, err) {
  const d = document.createElement('div');
  if (err) d.className = 'err';
  d.textContent = new Date().toLocaleTimeString('zh-CN', { hour12: false }) + '  ' + s;
  $('msg').appendChild(d);
  while ($('msg').childNodes.length > 200) $('msg').removeChild($('msg').firstChild);
  $('msg').scrollTop = $('msg').scrollHeight;
}
async function api(url, opt) {
  const r = await fetch(url, opt);
  let j;
  try { j = await r.json(); } catch (e) { const er = new Error('HTTP ' + r.status); er.status = r.status; throw er; }
  if (j && j.error) { const er = new Error(j.error); er.status = r.status; throw er; }
  return j;
}

// ---------------------------------------------------------------- layout: drawer / narrow pane
const NARROW = 760;
let narrow = null;
function layout() {
  const n = document.body.clientWidth < NARROW;
  if (n !== narrow) {
    narrow = n;
    document.body.classList.toggle('narrow', n);
    document.body.classList.toggle('collapsed', n);      // a narrow pane starts with the tree folded away
    $('more').classList.remove('open');
  }
  $('treeBtn').classList.toggle('on', !document.body.classList.contains('collapsed'));
}
new ResizeObserver(layout).observe(document.body);
$('treeBtn').onclick = () => { document.body.classList.toggle('collapsed'); layout(); };
$('moreBtn').onclick = () => $('more').classList.toggle('open');

// ---------------------------------------------------------------- three.js scene
const vp = $('vp');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.domElement.className = 'main';
renderer.setPixelRatio(window.devicePixelRatio);
vp.insertBefore(renderer.domElement, vp.firstChild);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, 1, 0.01, 1000);
scene.add(camera);
scene.add(new THREE.AmbientLight(0xffffff, 1.5));
const head = new THREE.DirectionalLight(0xffffff, 1.6);
head.position.set(0.4, 0.7, 1);
camera.add(head);
let controls = null;
const gModel = new THREE.Group(), gHi = new THREE.Group(), gSym = new THREE.Group();
scene.add(gModel, gHi, gSym);
let center = new THREE.Vector3(), diag = 1, dirty = true, box = null;
const halfRes = new THREE.Vector2(1, 1);            // half the viewport size in px (for the wide lines)

function makeControls() {
  const tgt = controls ? controls.target.clone() : center.clone();
  if (controls) controls.dispose();
  controls = new OrbitControls(camera, renderer.domElement);
  controls.target.copy(tgt);
  controls.rotateSpeed = 0.9;
  controls.addEventListener('change', () => { dirty = true; });
  controls.update();
}
function upVec() { return $('upSel').value === 'z' ? new THREE.Vector3(0, 0, 1) : new THREE.Vector3(0, 1, 0); }
// Distance from the model centre (looking back along dir) at which the model box just fills the view:
// each corner of the box needs its own distance, the largest one wins.  Some room is left for the symbols.
function fitDistance(dir) {
  const sphere = diag * 0.5 / Math.sin(THREE.MathUtils.degToRad(camera.fov / 2)) / Math.min(1, camera.aspect || 1);
  if (!box) return sphere * 1.08;
  const tanV = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)), tanH = tanV * (camera.aspect || 1);
  const right = new THREE.Vector3().crossVectors(camera.up, dir);
  if (right.lengthSq() < 1e-12) right.crossVectors(new THREE.Vector3(1, 0, 0), dir);
  if (right.lengthSq() < 1e-12) right.crossVectors(new THREE.Vector3(0, 1, 0), dir);
  right.normalize();
  const up = new THREE.Vector3().crossVectors(dir, right), r = new THREE.Vector3();
  let d = 0;
  for (let i = 0; i < 8; i++) {
    r.set(box[i & 1][0], box[(i >> 1) & 1][1], box[(i >> 2) & 1][2]).sub(center);
    const z = r.dot(dir);
    d = Math.max(d, z + Math.abs(r.dot(right)) / tanH, z + Math.abs(r.dot(up)) / tanV);
  }
  return isFinite(d) && d > diag * 1e-6 ? Math.min(d * 1.15, sphere * 1.08) : sphere * 1.08;
}
function setView(name) {
  const zUp = $('upSel').value === 'z';
  const D = zUp
    ? { front: [0, -1, 0], back: [0, 1, 0], top: [0, 0, 1], bottom: [0, 0, -1], left: [-1, 0, 0], right: [1, 0, 0], iso: [1, -1, 0.8] }
    : { front: [0, 0, 1], back: [0, 0, -1], top: [0, 1, 0], bottom: [0, -1, 0], left: [-1, 0, 0], right: [1, 0, 0], iso: [1, 0.8, 1] };
  let dir;
  if (name === 'fit') dir = camera.position.clone().sub(controls.target).normalize();
  else dir = new THREE.Vector3(...D[name]).normalize();
  camera.up.copy(upVec());
  if (name === 'top' || name === 'bottom') camera.up.copy(zUp ? new THREE.Vector3(0, 1, 0) : new THREE.Vector3(0, 0, -1));
  const dist = fitDistance(dir);
  camera.position.copy(center).addScaledVector(dir, dist);
  camera.near = dist / 400; camera.far = dist + diag * 50;
  camera.updateProjectionMatrix();
  makeControls();
  controls.target.copy(center);
  controls.update();
  dirty = true;
}
function resize() {
  const w = vp.clientWidth, h = vp.clientHeight;
  if (!w || !h) return;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  halfRes.set(w / 2, h / 2);
  dirty = true;
}
new ResizeObserver(resize).observe(vp);

// triad (bottom-left, like the CAE view triad)
const triR = new THREE.WebGLRenderer({ canvas: $('triad'), antialias: true, alpha: true });
triR.setPixelRatio(window.devicePixelRatio);
triR.setSize(96, 96, false);
const triS = new THREE.Scene(), triC = new THREE.OrthographicCamera(-1.5, 1.5, 1.5, -1.5, 0.1, 20);
function label(txt, color) {
  const c = document.createElement('canvas'); c.width = 64 * Math.max(1, txt.length * 0.62); c.height = 64;
  const g = c.getContext('2d'); g.font = 'bold 44px Tahoma'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.strokeStyle = '#000'; g.lineWidth = 5; g.strokeText(txt, c.width / 2, 32); g.fillStyle = color || '#fff'; g.fillText(txt, c.width / 2, 32);
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, depthTest: false }));
  s.scale.set(0.5 * c.width / 64, 0.5, 1);
  return s;
}
[[1, 0, 0, 0xd02020, 'X'], [0, 1, 0, 0x20b020, 'Y'], [0, 0, 1, 0x2030d0, 'Z']].forEach(([x, y, z, col, t]) => {
  const d = new THREE.Vector3(x, y, z);
  triS.add(new THREE.ArrowHelper(d, new THREE.Vector3(), 1, col, 0.32, 0.18));
  const s = label(t); s.position.copy(d).multiplyScalar(1.28); triS.add(s);
});

function animate() {
  requestAnimationFrame(animate);
  if (!dirty) return;

    for (let i = 3; i < px.length; i += 4) if (px[i] > 0) n++;
    return n / (w * h);
  } };
poll(); setInterval(poll, 1500);
</script>
